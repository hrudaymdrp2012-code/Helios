<!DOCTYPE html><html><head><meta charset="UTF-8"><meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>HELIOS Dashboard</title><style>

body{

margin:0;
padding:0;

background:#000;

color:cyan;

font-family:Arial,sans-serif;

overflow:hidden;

}

#grid{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
linear-gradient(
rgba(0,255,255,.05) 1px,
transparent 1px),

linear-gradient(
90deg,
rgba(0,255,255,.05) 1px,
transparent 1px);

background-size:40px 40px;

z-index:-1;

}

header{

text-align:center;

padding:15px;

}

#title{

font-size:38px;

font-weight:bold;

text-shadow:
0 0 20px cyan;

}

#userBox{

margin-top:10px;

font-size:14px;

}

#status{

font-size:12px;

margin-top:5px;

opacity:.8;

}

#hud{

width:260px;
height:260px;

margin:20px auto;

position:relative;

}

.ring{

position:absolute;

top:50%;
left:50%;

border-radius:50%;

transform:
translate(-50%,-50%);

}

.r1{

width:260px;
height:260px;

border:3px solid cyan;

border-top-color:transparent;

animation:spin 12s linear infinite;

}

.r2{

width:190px;
height:190px;

border:2px dashed cyan;

animation:spinReverse 8s linear infinite;

}

.r3{

width:120px;
height:120px;

border:2px solid cyan;

border-right-color:transparent;

animation:spin 5s linear infinite;

}

.core{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:90px;
height:90px;

border-radius:50%;

border:2px solid cyan;

display:flex;

justify-content:center;
align-items:center;

box-shadow:
0 0 20px cyan;

font-weight:bold;

}

.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:15px;

padding:20px;

max-width:500px;

margin:auto;

}

.card{

background:
rgba(0,255,255,.05);

border:1px solid cyan;

padding:25px;

text-align:center;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

.card:hover{

transform:scale(1.05);

box-shadow:
0 0 20px cyan;

}

.logout{

margin:20px auto;

display:block;

padding:12px 20px;

background:black;

color:red;

border:1px solid red;

border-radius:8px;

}

@keyframes spin{

from{

transform:
translate(-50%,-50%)
rotate(0deg);

}

to{

transform:
translate(-50%,-50%)
rotate(360deg);

}

}

@keyframes spinReverse{

from{

transform:
translate(-50%,-50%)
rotate(360deg);

}

to{

transform:
translate(-50%,-50%)
rotate(0deg);

}

}

</style></head><body><div id="grid"></div><header><div id="title">
HELIOS
</div><div id="userBox">USER:
<span id="username">

UNKNOWN

</span></div><div id="status">AI CORE ONLINE<br>
MEMORY ONLINE

</div></header><div id="hud"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core">HELIOS

</div></div><div class="grid"><div
class="card"
onclick="location.href='chat.html'">CHAT

</div><div
class="card"
onclick="location.href='routine.html'">ROUTINE

</div><div
class="card"
onclick="location.href='notes.html'">NOTES

</div><div
class="card"
onclick="location.href='settings.html'">SETTINGS

</div></div><button
class="logout"
onclick="logout()">

LOGOUT

</button><script>

let user =
localStorage.getItem(
"user"
);

document.getElementById(
"username"
).textContent =
user || "UNKNOWN";

function logout(){

localStorage.removeItem(
"user"
);

location.href =
"login.html";

}

</script></body></html>
