<!DOCTYPE html>
<html>

<head>

<title>HELIOS LOGIN</title>

<style>

body{

background:black;
color:cyan;
font-family:Arial;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.box{

text-align:center;

}

input{

padding:12px;
margin:10px;

background:black;
color:cyan;

border:1px solid cyan;

}

button{

padding:12px 20px;

background:cyan;
color:black;

border:none;

}

</style>

</head>

<body>

<div class="box">

<h1>HELIOS LOGIN</h1>

<input
id="user"
placeholder="Username">

<br>

<input
id="pass"
type="password"
placeholder="Password">

<br>

<button
onclick="login()">

LOGIN

</button>

</div>

<script>

function login(){

let u =
document.getElementById(
"user"
).value;

let p =
document.getElementById(
"pass"
).value;

if(
u==="HC"
&&
p==="hc123"
){

localStorage.setItem(
"user",
"HC"
);

location.href=
"dashboard.html";

}

else if(
u==="Stephen"
&&
p==="stephen123"
){

localStorage.setItem(
"user",
"Stephen"
);

location.href=
"dashboard.html";

}

else{

alert(
"Invalid Login"
);

}

}

</script>

</body>

</html>
