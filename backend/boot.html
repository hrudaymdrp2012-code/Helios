<script>

const lines = [

"AI CORE ........ ONLINE",

"MEMORY ......... ONLINE",

"VOICE .......... ONLINE",

"NETWORK ........ ONLINE",

"READY"

];

let i = 0;

const boot =
document.getElementById("boot");

},1500);

},800);
